<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Course Street View</title>
<meta name="description" content="Gravel bike routes around Cisauk and BSD. Preview every turn in Street View, then download the GPX for your Garmin.">
<meta name="theme-color" content="#d9381e">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bike courses">
<meta property="og:title" content="Bike courses: ride it in Street View">
<meta property="og:description" content="Gravel bike routes around Cisauk and BSD. Preview every turn in Street View, then download the GPX for your Garmin.">
<meta property="og:url" content="https://bike.davidyosuanto.com/viewer.html">
<meta property="og:image" content="https://bike.davidyosuanto.com/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Bike courses: a route map with six numbered stops">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f5f6f7; --fg:#1d2329; --muted:#5b6670; --line:#d5d9dd; --accent:#d9381e; --done:#1e6fd9; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100%; height:100dvh; }
  #error { display:none; margin:24px; padding:16px; background:#fff3f0; border:1px solid #e6a79a; border-radius:6px; }
  #head { display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); font-size:14px; }
  #head a { color:var(--accent); }
  #head h1 { font-size:16px; margin:0; flex:1 1 auto; }
  #titleBlock { display:contents; }
  .lbl-short { display:none; }
  #app { flex:1; display:flex; flex-direction:column; min-height:0; }
  #bar { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); }
  #bar button, #bar select { font:inherit; padding:5px 10px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; }
  #bar button:hover { background:#eef0f2; }
  #bar .group { display:flex; gap:6px; align-items:center; }
  /* Desktop: the button row and the More panel are transparent wrappers, so their children sit in the bar as before. */
  #btnRow, #morePanel { display:contents; }
  #more { display:none; }
  #slider { flex:1 1 220px; min-width:140px; }
  #status { padding:6px 12px; font-size:14px; color:var(--muted); background:#fff; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; }
  #status strong { color:var(--fg); }
  #status a { color:var(--accent); margin-left:auto; }
  #panes { flex:1; display:flex; min-height:0; }
  #svPane { flex:3; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  #svWrap { flex:1; position:relative; display:flex; min-height:0; }
  #svWrap iframe { flex:1; width:100%; border:0; background:#222; min-height:0; }
  #note { margin:0; padding:5px 12px; font-size:12.5px; color:var(--muted); background:#fff; border-top:1px solid var(--line); }
  #mapPane { flex:2; min-width:0; min-height:0; border-left:1px solid var(--line); position:relative; z-index:0; }
  #map { position:absolute; inset:0; }
  #legend { position:absolute; left:8px; top:8px; z-index:1000; pointer-events:none; display:flex; flex-direction:column; align-items:flex-start; gap:4px;
    background:rgba(255,255,255,.97); border-radius:6px; padding:3px 8px; max-width:calc(100% - 60px); max-height:calc(100% - 16px); font-size:12px; line-height:1.5; color:var(--fg); box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #legendRow { display:flex; gap:10px; align-items:center; }
  #stopsToggle { pointer-events:auto; font:inherit; color:inherit; background:#fff; border:1px solid var(--line); border-radius:5px;
    padding:2px 8px; min-height:24px; cursor:pointer; white-space:nowrap; }
  #stopsToggle .caret { font-size:10px; margin-left:3px; }
  #stopsList { pointer-events:auto; list-style:none; margin:0; padding:0; max-width:100%; min-height:0; overflow-y:auto; white-space:nowrap;
    font-size:12px; line-height:18px; }
  #stopsList[hidden] { display:none; }
  #stopsList li { display:flex; align-items:flex-start; gap:6px; padding:2px 0; cursor:pointer; overflow-wrap:anywhere; }
  .stop-badge { flex:none; width:16px; height:16px; border-radius:50%; background:#ffd23f; border:1.5px solid #222; color:#1d2329;
    font-size:10px; font-weight:700; line-height:13px; text-align:center; margin-top:1px; }
  .stop-wrap { background:none; border:0; }
  .stop-dot { width:20px; height:20px; border-radius:50%; background:#ffd23f; border:1.5px solid #222; color:#1d2329;
    font:700 12px/17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align:center; }
  #legend .it { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  #legend .sw { display:inline-block; width:18px; height:0; border-top:4px solid; border-radius:2px; }
  #legend .sw-done { border-top-color:#1e6fd9; }
  #legend .sw-ahead { border-top-color:#d9381e; }
  .stop-label { background:#fff; border:1px solid #888; border-radius:3px; padding:1px 4px; font-size:11px; white-space:nowrap; box-shadow:none; }
  .stop-label:before { display:none; }
  .cur-wrap { background:none; border:0; }
  #turn-banner { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:5; pointer-events:none;
    display:none; align-items:center; gap:12px; padding:8px 16px; border-radius:10px; max-width:calc(100% - 340px); min-width:200px;
    background:rgba(20,24,28,.78); color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.4); }
  #turn-banner[data-state="ahead"], #turn-banner[data-state="now"] { display:flex; }
  #turn-banner[data-state="now"] { background:#ffb300; color:#1d2329; }
  #turn-banner .tb-arrow { font-size:44px; line-height:1; min-width:44px; text-align:center; }
  #turn-banner .tb-main { font-size:20px; font-weight:700; line-height:1.2; }
  #turn-banner .tb-text { font-size:18px; line-height:1.25; }
  #turn-banner .tb-then { font-size:13px; opacity:.85; margin-top:3px; }
  .turn-wrap { background:none; border:0; }
  /* Zoomed out, turn markers would cover the route: show only the next turn until the map is zoomed in. */
  .turns-far .turn-dot:not(.next) { display:none; }
  .turns-far .turn-wrap { pointer-events:none; }
  .turn-dot { width:16px; height:16px; border-radius:50%; background:#fff; border:1.5px solid #444; color:#222;
    font-size:11px; line-height:13px; text-align:center; font-weight:700; }
  .turn-dot.next { background:#ffb300; border-color:#b36b00; box-shadow:0 0 0 3px rgba(255,179,0,.5); }

  /* Phone layout. Keep this query identical to PHONE_QUERY in the placement script below. */
  @media (max-width:800px), (max-height:480px) and (orientation:landscape) {
    body { overflow:hidden; }
    .lbl-long { display:none; }
    .lbl-short { display:inline; }
    #head { flex:none; flex-wrap:nowrap; align-items:center; gap:4px; min-height:52px; padding:4px 10px 4px 4px; }
    #back { flex:none; display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; font-size:26px; line-height:1; text-decoration:none; }
    #titleBlock { display:block; flex:1 1 auto; min-width:0; }
    #head h1 { font-size:16px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #status { display:block; padding:0; border:0; background:none; font-size:12.5px; line-height:1.3;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #status > * { margin-right:10px; }
    #sIdx { display:none; }
    #panes { flex:1 1 0; flex-direction:column; }
    #svPane { flex:4 1 0; }
    #mapPane { flex:5 1 0; border-left:0; border-top:1px solid var(--line); }
    /* Turn strip: a normal-flow band directly under the Street View, never over the image. */
    #turn-banner { position:static; top:auto; left:auto; transform:none; flex:none; width:100%; max-width:none; min-width:0;
      min-height:52px; padding:4px 12px; gap:10px; border-radius:0; box-shadow:none; background:#14181c; }
    #turn-banner[data-state="now"] { background:#ffb300; color:#1d2329; }
    #turn-banner .tb-arrow { font-size:30px; min-width:34px; }
    #turn-banner > div:last-child { flex:1 1 0; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 8px; }
    #turn-banner .tb-main { flex:none; font-size:17px; }
    #turn-banner .tb-text { flex:1 1 0; min-width:0; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #turn-banner .tb-then { flex:1 0 100%; min-width:0; font-size:12px; margin-top:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* Dock */
    #bar { flex:none; position:relative; z-index:10; flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:6px;
      padding:8px 12px calc(8px + env(safe-area-inset-bottom)); border-bottom:0; border-top:1px solid var(--line); }
    #slider { order:-1; flex:none; width:100%; min-width:0; height:32px; margin:0; accent-color:var(--accent); }
    #btnRow { display:flex; gap:6px; }
    #btnRow .group, #turnBtns { display:contents; }
    #btnRow button { flex:1 1 0; min-width:44px; min-height:48px; padding:0 2px; font-size:14px; line-height:1.1;
      display:flex; align-items:center; justify-content:center; white-space:nowrap; }
    #btnRow #play { flex:1.4 1 0; font-size:15px; }
    #bar #play { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    #bar #play:hover { background:#c0321a; }
    #prevTurn { order:1; } #prev { order:2; } #play { order:3; } #next { order:4; } #nextTurn { order:5; } #more { order:6; }
    #more { font-size:20px; }
    /* More sheet */
    #morePanel { display:none; position:absolute; left:0; right:0; bottom:100%; z-index:20; flex-direction:column; gap:8px;
      max-height:60vh; overflow:auto; padding:8px 12px; background:#fff; border-top:1px solid var(--line); box-shadow:0 -6px 16px rgba(0,0,0,.18); }
    #app.more-open #morePanel { display:flex; }
    #morePanel .group { flex-wrap:wrap; min-height:44px; }
    #morePanel select { min-height:44px; font-size:16px; }
    #morePanel #jumps button { min-height:44px; padding:0 14px; }
    #morePanel a { display:flex; align-items:center; min-height:44px; margin:0; color:var(--accent); }
    #morePanel #note { padding:4px 0; border:0; }
    #stopsToggle { min-height:28px; padding:4px 10px; }
    #stopsList li { padding:3px 0; }
  }
  /* Landscape phone: panes side by side, dock in one compact row. */
  @media (max-height:480px) and (orientation:landscape) {
    #head { min-height:44px; padding:0 max(10px, env(safe-area-inset-right)) 0 max(4px, env(safe-area-inset-left)); }
    #panes { flex-direction:row; }
    #svPane { flex:1 1 0; }
    #mapPane { flex:1 1 0; border-top:0; border-left:1px solid var(--line); }
    #turn-banner { min-height:40px; padding:2px 10px; }
    #turn-banner .tb-arrow { font-size:24px; min-width:28px; }
    #bar { flex-direction:row; align-items:center; gap:10px;
      padding:4px max(12px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
    #slider { order:0; flex:1 1 0; width:auto; min-width:120px; }
    #btnRow { flex:none; }
    #btnRow button { flex:none; width:52px; min-height:44px; }
    #btnRow #play { width:64px; }
  }
</style>
</head>
<body>
<div id="error"></div>
<div id="app">
  <div id="head">
    <a id="back" href="index.html" aria-label="All courses" title="All courses"><span class="lbl-long">&larr; All courses</span><span class="lbl-short">&larr;</span></a>
    <div id="titleBlock">
      <h1 id="courseName"></h1>
      <div id="status">
        <strong id="sSection"></strong>
        <span id="sKm"></span>
        <span id="sIdx"></span>
        <span id="sTurn"></span>
      </div>
    </div>
  </div>
  <div id="panes">
    <div id="svPane">
      <div id="svWrap">
        <iframe id="sv" title="Google Street View" allow="accelerometer; gyroscope" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div id="turn-banner" data-state="none" aria-live="polite"></div>
    </div>
    <div id="mapPane">
      <div id="map"></div>
      <div id="legend">
        <div id="legendRow">
          <span class="it"><span class="sw sw-done"></span>Ridden</span>
          <span class="it"><span class="sw sw-ahead"></span>Ahead</span>
          <button id="stopsToggle" type="button" aria-expanded="false" aria-controls="stopsList">Stops <span class="caret" aria-hidden="true">&#9662;</span></button>
        </div>
        <ol id="stopsList" hidden></ol>
      </div>
    </div>
  </div>
  <div id="bar">
    <div id="btnRow">
      <div class="group">
        <button id="prev" title="Previous (Left arrow)" aria-label="Previous"><span class="lbl-long">&#9664; Previous</span><span class="lbl-short">&#9664;</span></button>
        <button id="play" title="Play/Pause (Space)">Play</button>
        <button id="next" title="Next (Right arrow)" aria-label="Next"><span class="lbl-long">Next &#9654;</span><span class="lbl-short">&#9654;</span></button>
      </div>
      <div class="group" id="turnBtns" style="display:none">
        <button id="prevTurn" title="Previous turn (Down arrow)" aria-label="Previous turn"><span class="lbl-long">&#9664; Prev turn</span><span class="lbl-short">&#9198; turn</span></button>
        <button id="nextTurn" title="Next turn (Up arrow)" aria-label="Next turn"><span class="lbl-long">Next turn &#9654;</span><span class="lbl-short">turn &#9197;</span></button>
      </div>
      <button id="more" type="button" aria-expanded="false" aria-controls="morePanel" aria-label="More controls" title="More: speed, sections, links">&#8943;</button>
    </div>
    <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Position along course">
    <div id="morePanel">
      <div class="group">
        <label for="speed">Speed</label>
        <select id="speed">
          <option value="1500">1.5 s / step</option>
          <option value="2500" selected>2.5 s / step</option>
          <option value="4000">4 s / step</option>
        </select>
      </div>
      <div class="group" id="jumps"></div>
      <a id="gmaps" target="_blank" rel="noopener" href="#">Open this spot in Google Maps</a>
      <a id="dlGpx" download href="#">Download GPX</a>
      <p id="note">A blank or black view means Google has no Street View imagery at this spot. Press Next to move on.</p>
    </div>
  </div>
</div>
<script>
/* Place the nodes that live in different spots on phone and desktop. Runs before first paint and on every breakpoint change. */
(function () {
  var PHONE_QUERY = '(max-width:800px), (max-height:480px) and (orientation:landscape)';
  var mq = window.matchMedia ? window.matchMedia(PHONE_QUERY) : null;
  function $(id) { return document.getElementById(id); }
  function place() {
    var phone = !!(mq && mq.matches);
    var app = $('app'), panes = $('panes'), bar = $('bar'), status = $('status');
    if (phone) {
      app.appendChild(bar);
      $('titleBlock').appendChild(status);
      var panel = $('morePanel');
      panel.appendChild($('gmaps')); panel.appendChild($('dlGpx')); panel.appendChild($('note'));
    } else {
      app.insertBefore(bar, panes);
      app.insertBefore(status, panes);
      status.appendChild($('gmaps'));
      $('head').appendChild($('dlGpx'));
      $('svPane').appendChild($('note'));
      app.classList.remove('more-open');
      $('more').setAttribute('aria-expanded', 'false');
    }
  }
  place();
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', place); else if (mq.addListener) mq.addListener(place); }
})();
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';
  var STEP_M = 40, AHEAD_M = 8;

  function showError(msg) {
    var e = document.getElementById('error');
    e.textContent = msg + ' ';
    var a = document.createElement('a');
    a.href = 'index.html';
    a.textContent = 'Back to all courses';
    e.appendChild(a);
    e.style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
  function loadScript(src, ok, bad) {
    var s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = bad;
    document.head.appendChild(s);
  }
  function loadCourse(slug) {
    if (!/^[a-z0-9-]+$/.test(slug)) { showError('Invalid course name.'); return; }
    loadScript('courses/' + slug + '/course-data.js', function () {
      var C = window.COURSE;
      if (!C || !C.segments || !C.segments.length) { showError('The data for course "' + slug + '" is not valid.'); return; }
      boot(C, slug);
    }, function () { showError('Could not load course "' + slug + '".'); });
  }
  var param = new URLSearchParams(location.search).get('course');
  if (param !== null) loadCourse(param);
  else loadScript('courses/index.js', function () {
    var list = window.COURSES;
    if (!list || !list.length) { showError('There are no courses yet.'); return; }
    loadCourse(list[0].slug);
  }, function () { showError('Could not load the course list.'); });

function boot(C, slug) {
  var STORE_KEY = 'streetview.index.' + slug;
  document.title = C.name + ' \u2013 Street View';
  document.getElementById('courseName').textContent = C.name;
  var dl = document.getElementById('dlGpx'); dl.href = 'courses/' + slug + '/' + C.gpx;

  // ---- geometry ----
  var R = 6371000, rad = Math.PI / 180;
  function hav(a, b) {
    var dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function bearing(a, b) {
    var p1 = a[0] * rad, p2 = b[0] * rad, dl = (b[1] - a[1]) * rad;
    var y = Math.sin(dl) * Math.cos(p2);
    var x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
    return ((Math.atan2(y, x) / rad) + 360) % 360;
  }

  // ---- full course ----
  var course = [], pieceEnds = [], pieceNames = [], jumpDefs = [];
  function addPiece(arr, name) {
    for (var i = (course.length ? 1 : 0); i < arr.length; i++) course.push(arr[i]);
    pieceEnds.push(course.length - 1);
    pieceNames.push(name);
  }
  C.segments.forEach(function (sg) {
    var reps = sg.repeat || 1;
    for (var l = 0; l < reps; l++) {
      addPiece(sg.points, reps > 1 ? sg.label + ' ' + (l + 1) + ' of ' + reps : sg.label);
      jumpDefs.push(reps > 1 ? sg.label + ' ' + (l + 1) : sg.label);
    }
  });

  var cum = [0];
  for (var i = 1; i < course.length; i++) cum.push(cum[i - 1] + hav(course[i - 1], course[i]));
  var total = cum[cum.length - 1];
  var pieceEndDist = pieceEnds.map(function (k) { return cum[k]; });

  function sectionAt(d) {
    for (var p = 0; p < pieceEndDist.length; p++) if (d <= pieceEndDist[p] + 0.5) return pieceNames[p];
    return pieceNames[pieceNames.length - 1];
  }
  var seg = 0;
  function posAt(d) { // linear scan helper with a binary search
    var lo = 0, hi = cum.length - 1;
    if (d >= total) return course[course.length - 1];
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
    var span = cum[hi] - cum[lo], t = span > 0 ? (d - cum[lo]) / span : 0;
    return [course[lo][0] + (course[hi][0] - course[lo][0]) * t,
            course[lo][1] + (course[hi][1] - course[lo][1]) * t];
  }

  // ---- view points ----
  var dists = [];
  for (var d = 0; d < total; d += STEP_M) dists.push(d);
  dists.push(total);
  var points = dists.map(function (d) {
    var p = posAt(d);
    return { lat: p[0], lon: p[1], km: d / 1000, heading: 0, section: sectionAt(d), _d: d };
  });
  for (var k = 0; k < points.length; k++) {
    if (k === points.length - 1 && k > 0) { points[k].heading = points[k - 1].heading; continue; }
    var a = [points[k].lat, points[k].lon];
    var ahead = posAt(Math.min(total, points[k]._d + AHEAD_M));
    var h = hav(a, ahead) > 0.5 ? bearing(a, ahead) : (k > 0 ? points[k - 1].heading : 0);
    points[k].heading = h;
  }

  // ---- DOM ----
  var $ = function (id) { return document.getElementById(id); };
  var slider = $('slider'), sv = $('sv'), playBtn = $('play');
  slider.max = points.length - 1;

  var index = 0;
  try {
    var saved = parseInt(localStorage.getItem(STORE_KEY), 10);
    if (isFinite(saved) && saved >= 0 && saved < points.length) index = saved;
  } catch (e) {}

  // ---- map ----
  var map = L.map('map', { zoomControl: true });
  map.zoomControl.setPosition('topright');
  // OpenStreetMap's tile server needs a Referer, which a page opened from disk (file://) cannot send,
  // so the hosted site uses OpenStreetMap and a local file falls back to Esri. Neither needs an API key.
  if (/^https?:$/.test(location.protocol)) {
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
  } else {
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);
  }
  var allLL = course.map(function (p) { return [p[0], p[1]]; });
  var full = L.polyline(allLL, { color: '#d9381e', weight: 4, opacity: 0.75 }).addTo(map);
  var ridden = L.polyline([], { color: '#1e6fd9', weight: 5, opacity: 0.95 }).addTo(map);
  map.fitBounds(full.getBounds(), { padding: [20, 20] });
  var stopMarkers = [];
  (C.stops || []).forEach(function (s, i) {
    var mk = L.marker([s[1], s[2]], {
      icon: L.divIcon({ html: '<div class="stop-dot">' + (i + 1) + '</div>', className: 'stop-wrap', iconSize: [20, 20], iconAnchor: [10, 10] }),
      zIndexOffset: 300
    }).bindTooltip((i + 1) + '. ' + String(s[0]), { permanent: false, direction: 'top', offset: [0, -10], className: 'stop-label' }).addTo(map);
    mk.on('click', function (ev) { if (ev.originalEvent) L.DomEvent.stopPropagation(ev.originalEvent); mk.openTooltip(); });
    stopMarkers.push(mk);
  });

  // ---- stops legend ----
  (function () {
    var legendEl = $('legend'), tog = $('stopsToggle'), list = $('stopsList'), caret = tog.querySelector('.caret');
    var stops = C.stops || [];
    if (!stops.length) { tog.parentNode.removeChild(tog); list.parentNode.removeChild(list); return; }
    L.DomEvent.disableClickPropagation(legendEl);
    L.DomEvent.disableScrollPropagation(list);
    stops.forEach(function (s, i) {
      var li = document.createElement('li'), b = document.createElement('span'), t = document.createElement('span');
      b.className = 'stop-badge'; b.textContent = String(i + 1);
      t.textContent = String(s[0]);
      li.appendChild(b); li.appendChild(t);
      li.addEventListener('click', function () {
        // On a phone the open list covers much of the small map, so fold it away to show the stop.
        if (window.matchMedia && window.matchMedia(PHONE_Q).matches) { open = false; apply(); }
        map.panTo([s[1], s[2]]); stopMarkers[i].openTooltip();
      });
      list.appendChild(li);
    });
    var PHONE_Q = '(max-width:800px), (max-height:480px) and (orientation:landscape)';
    var open = !(window.matchMedia && window.matchMedia(PHONE_Q).matches);
    try { var st = localStorage.getItem('streetview.stops.open'); if (st === '1') open = true; else if (st === '0') open = false; } catch (e) {}
    function apply() {
      list.hidden = !open;
      tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      caret.textContent = open ? '\u25B4' : '\u25BE';
    }
    tog.addEventListener('click', function () {
      open = !open; apply();
      try { localStorage.setItem('streetview.stops.open', open ? '1' : '0'); } catch (e) {}
    });
    apply();
  })();
  function curIcon(h) {
    var svg = '<svg width="44" height="44" viewBox="-22 -22 44 44" style="transform:rotate(' + h + 'deg);overflow:visible">' +
      '<path d="M0,-20 L9,-4 L-9,-4 Z" fill="#1e6fd9" fill-opacity="0.55" stroke="#1e6fd9" stroke-width="1"/>' +
      '<circle r="6" fill="#fff" stroke="#1e6fd9" stroke-width="3"/></svg>';
    return L.divIcon({ html: svg, className: 'cur-wrap', iconSize: [44, 44], iconAnchor: [22, 22] });
  }
  var curMarker = L.marker([points[0].lat, points[0].lon], { icon: curIcon(0), zIndexOffset: 1000, interactive: false }).addTo(map);

  map.on('click', function (ev) {
    var best = -1, bestD = Infinity, ds = new Array(points.length);
    for (var i = 0; i < points.length; i++) {
      var dd = hav([ev.latlng.lat, ev.latlng.lng], [points[i].lat, points[i].lon]);
      ds[i] = dd;
      if (dd < bestD) { bestD = dd; best = i; }
    }
    var pick = best, pd = Infinity, tol = bestD + 25;
    for (var j = index; j < points.length; j++) if (ds[j] <= tol && ds[j] < pd) { pd = ds[j]; pick = j; }
    setIndex(pick);
  });

  // ---- turns ----
  var turns = (C.turns && C.turns.length) ? C.turns.slice().sort(function (a, b) { return a.d - b.d; }) : [];
  var GLYPH = { left: '\u2190', right: '\u2192', 'slight-left': '\u2196', 'slight-right': '\u2197',
    'sharp-left': '\u2199', 'sharp-right': '\u2198', uturn: '\u21A9', roundabout: '\u27F3',
    'roundabout-left': '\u21B0', 'roundabout-right': '\u21B1', start: '\u25B6', finish: '\u2691' };
  function glyph(t) { return GLYPH[t] || '\u2191'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function turnIdxFor(dist) { // first turn with d >= dist - 15, or turns.length
    for (var i = 0; i < turns.length; i++) if (turns[i].d >= dist - 15) return i;
    return turns.length;
  }
  function viewIdxBefore(d) { // nearest view point with distance <= d - 40, min 0
    var best = 0, lim = d - 40;
    for (var i = 0; i < points.length; i++) { if (points[i]._d <= lim) best = i; else break; }
    return best;
  }
  function nextTurn() {
    if (!turns.length) return null;
    var dist = points[index]._d, i = turnIdxFor(dist);
    if (i >= turns.length) return null;
    return { index: i, turn: turns[i], distance: turns[i].d - dist };
  }
  function fmtAhead(m) {
    if (m >= 1000) return 'In ' + (m / 1000).toFixed(1) + ' km';
    return 'In ' + (Math.round(m / 10) * 10) + ' m';
  }
  var turnMarkers = [], litMarker = -1;
  turns.forEach(function (t, i) {
    var mk = L.marker([t.lat, t.lon], {
      icon: L.divIcon({ html: '<div class="turn-dot">' + glyph(t.type) + '</div>', className: 'turn-wrap', iconSize: [16, 16], iconAnchor: [8, 8] }),
      zIndexOffset: 200
    }).bindTooltip(esc(t.text) + ' \u2013 km ' + (t.d / 1000).toFixed(2)).addTo(map);
    mk.on('click', function (ev) { if (ev.originalEvent) L.DomEvent.stopPropagation(ev); setIndex(viewIdxBefore(t.d)); });
    turnMarkers.push(mk);
  });
  function turnZoom() { map.getContainer().classList.toggle('turns-far', map.getZoom() < 16); }
  map.on('zoomend', turnZoom); turnZoom();
  function setLit(i) {
    if (i === litMarker) return;
    if (litMarker >= 0 && turnMarkers[litMarker]) {
      var o = turnMarkers[litMarker].getElement(); if (o) o.firstChild.classList.remove('next');
      turnMarkers[litMarker].setZIndexOffset(200);
    }
    litMarker = i;
    if (i >= 0 && turnMarkers[i]) {
      var n = turnMarkers[i].getElement(); if (n) n.firstChild.classList.add('next');
      turnMarkers[i].setZIndexOffset(900);
    }
  }
  function renderTurns() {
    var banner = $('turn-banner');
    if (!turns.length) { banner.setAttribute('data-state', 'none'); return; }
    var nt = nextTurn();
    $('sTurn').textContent = 'turn ' + (nt ? nt.index + 1 : turns.length) + ' / ' + turns.length;
    setLit(nt ? nt.index : -1);
    if (!nt) { banner.setAttribute('data-state', 'none'); banner.innerHTML = ''; return; }
    var t = nt.turn, state = nt.distance <= 30 ? 'now' : 'ahead';
    var then = '', after = turns[nt.index + 1];
    if (after && after.d - t.d <= 150) {
      then = '<div class="tb-then">Then: ' + esc(after.text) + ' in ' + Math.round((after.d - t.d) / 10) * 10 + ' m</div>';
    }
    banner.innerHTML = '<div class="tb-arrow">' + glyph(t.type) + '</div><div>' +
      '<div class="tb-main">' + (state === 'now' ? 'NOW' : fmtAhead(nt.distance)) + '</div>' +
      '<div class="tb-text">' + esc(t.text) + '</div>' + then + '</div>';
    banner.setAttribute('data-state', state);
  }
  function jumpNextTurn() {
    var dist = points[index]._d;
    for (var i = 0; i < turns.length; i++) { var vi = viewIdxBefore(turns[i].d); if (vi > index) { setIndex(vi); return; } }
  }
  function jumpPrevTurn() {
    var dist = points[index]._d;
    for (var i = turns.length - 1; i >= 0; i--) { var vi = viewIdxBefore(turns[i].d); if (vi < index) { setIndex(vi); return; } }
  }
  if (turns.length) $('turnBtns').style.display = '';
  $('nextTurn').addEventListener('click', jumpNextTurn);
  $('prevTurn').addEventListener('click', jumpPrevTurn);

  // ---- state / rendering ----
  var timer = null, svTimer = null;
  function loadSV() {
    var p = points[index];
    sv.src = 'https://www.google.com/maps/embed?origin=mfe&pb=!6m7!1m6!2m2!1d' + p.lat.toFixed(6) +
      '!2d' + p.lon.toFixed(6) + '!3f' + Math.round(p.heading) + '!4f-0!5f1';
  }
  function render() {
    var p = points[index];
    slider.value = index;
    $('sSection').textContent = p.section;
    $('sKm').textContent = 'km ' + p.km.toFixed(2) + ' of ' + points[points.length - 1].km.toFixed(2);
    $('sIdx').textContent = (index + 1) + ' / ' + points.length;
    $('gmaps').href = 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' +
      p.lat.toFixed(6) + ',' + p.lon.toFixed(6) + '&heading=' + Math.round(p.heading);
    renderTurns();
    curMarker.setLatLng([p.lat, p.lon]);
    curMarker.setIcon(curIcon(Math.round(p.heading)));
    var done = [];
    for (var i = 0; i <= index; i++) done.push([points[i].lat, points[i].lon]);
    ridden.setLatLngs(done);
    if (!map.getBounds().pad(-0.05).contains([p.lat, p.lon])) map.panTo([p.lat, p.lon]);
    try { localStorage.setItem(STORE_KEY, String(index)); } catch (e) {}
    clearTimeout(svTimer);
    svTimer = setTimeout(loadSV, 250);
  }
  function setIndex(i) {
    i = Math.max(0, Math.min(points.length - 1, Math.round(Number(i)) || 0));
    index = i;
    render();
  }

  // ---- play ----
  function stepMs() { return parseInt($('speed').value, 10) || 2500; }
  function stop() { clearInterval(timer); timer = null; playBtn.textContent = 'Play'; }
  function start() {
    if (index >= points.length - 1) setIndex(0);
    playBtn.textContent = 'Pause';
    clearInterval(timer);
    timer = setInterval(function () {
      if (index >= points.length - 1) { stop(); return; }
      setIndex(index + 1);
      if (index >= points.length - 1) stop();
    }, stepMs());
  }
  function toggle() { if (timer) stop(); else start(); }

  $('prev').addEventListener('click', function () { setIndex(index - 1); });
  $('next').addEventListener('click', function () { setIndex(index + 1); });
  playBtn.addEventListener('click', toggle);
  $('speed').addEventListener('change', function () { if (timer) start(); });
  slider.addEventListener('input', function () { setIndex(slider.value); });

  var jumps = $('jumps'), seen = {};
  points.forEach(function (p, i) {
    if (seen[p.section] !== undefined) return;
    seen[p.section] = i;
    var label = jumpDefs[pieceNames.indexOf(p.section)];
    var b = document.createElement('button');
    b.textContent = label;
    b.title = 'Jump to ' + p.section;
    b.addEventListener('click', function () { setIndex(i); setMore(false); });
    jumps.appendChild(b);
  });

  // ---- More sheet (phone) ----
  var appEl = $('app'), moreBtn = $('more');
  function refreshMap() { setTimeout(function () { map.invalidateSize(); }, 60); }
  function setMore(open) {
    appEl.classList.toggle('more-open', open);
    moreBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    refreshMap();
  }
  moreBtn.addEventListener('click', function () { setMore(!appEl.classList.contains('more-open')); });
  window.addEventListener('orientationchange', refreshMap);

  document.addEventListener('keydown', function (ev) {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var t = ev.target, tag = t && t.tagName;
    if (ev.key === 'Escape') { if (appEl.classList.contains('more-open')) setMore(false); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); setIndex(index - 1); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); setIndex(index + 1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); jumpNextTurn(); }
    else if (ev.key === 'ArrowDown') { ev.preventDefault(); jumpPrevTurn(); }
    else if (ev.key === ' ' || ev.code === 'Space') {
      if (tag === 'BUTTON' || tag === 'SELECT' || tag === 'A') return; // let focused controls act on Space
      ev.preventDefault(); toggle();
    }
  });
  window.addEventListener('resize', function () { map.invalidateSize(); refreshMap(); });

  window.__viewer = { course: slug, points: points, getIndex: function () { return index; }, setIndex: setIndex, turns: turns, nextTurn: nextTurn, stopMarkers: stopMarkers };

  render();
  clearTimeout(svTimer);
  loadSV(); // first load without the debounce delay
}
})();
</script>
</body>
</html>
