<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f5f6f7; --fg:#1d2329; --muted:#5b6670; --line:#d5d9dd; --accent:#d9381e; --done:#1e6fd9; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100%; height:100dvh; }
  #error { display:none; margin:24px; padding:16px; background:#fff3f0; border:1px solid #e6a79a; border-radius:6px; }
  #head { display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); font-size:14px; }
  #head a { color:var(--accent); }
  #head h1 { font-size:16px; margin:0; flex:1 1 auto; }
  #titleBlock { display:contents; }
  .lbl-short { display:none; }
  #app { flex:1; display:flex; flex-direction:column; min-height:0; }
  #bar { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); }
  #bar button, #bar select { font:inherit; padding:5px 10px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; }
  #bar button:hover { background:#eef0f2; }
  #bar .group { display:flex; gap:6px; align-items:center; }
  /* Desktop: the button row and the More panel are transparent wrappers, so their children sit in the bar as before. */
  #btnRow, #morePanel { display:contents; }
  #more { display:none; }
  #slider { flex:1 1 220px; min-width:140px; }
  #status { padding:6px 12px; font-size:14px; color:var(--muted); background:#fff; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; }
  #status strong { color:var(--fg); }
  #status a { color:var(--accent); margin-left:auto; }
  #panes { flex:1; display:flex; min-height:0; }
  #svPane { flex:3; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  #svWrap { flex:1; position:relative; display:flex; min-height:0; }
  #svWrap iframe { flex:1; width:100%; border:0; background:#222; min-height:0; }
  #note { margin:0; padding:5px 12px; font-size:12.5px; color:var(--muted); background:#fff; border-top:1px solid var(--line); }
  #mapPane { flex:2; min-width:0; min-height:0; border-left:1px solid var(--line); position:relative; z-index:0; }
  #map { position:absolute; inset:0; }
  #legend { position:absolute; left:8px; top:8px; z-index:1002; pointer-events:none; display:flex; flex-direction:column; align-items:flex-start; gap:4px;
    background:rgba(255,255,255,.97); border-radius:6px; padding:3px 8px; max-width:calc(100% - 60px); max-height:calc(100% - 16px); font-size:12px; line-height:1.5; color:var(--fg); box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #legendRow { display:flex; gap:10px; align-items:center; }
  #stopsToggle { pointer-events:auto; font:inherit; color:inherit; background:#fff; border:1px solid var(--line); border-radius:5px;
    padding:2px 8px; min-height:24px; cursor:pointer; white-space:nowrap; }
  #stopsToggle .caret { font-size:10px; margin-left:3px; }
  #stopsList { pointer-events:auto; list-style:none; margin:0; padding:0; max-width:100%; min-height:0; overflow-y:auto; white-space:nowrap;
    font-size:12px; line-height:18px; }
  #stopsList[hidden] { display:none; }
  #stopsList li { display:flex; align-items:flex-start; gap:6px; padding:2px 0; cursor:pointer; overflow-wrap:anywhere; }
  .stop-badge { flex:none; width:16px; height:16px; border-radius:50%; background:#ffd23f; border:1.5px solid #222; color:#1d2329;
    font-size:10px; font-weight:700; line-height:13px; text-align:center; margin-top:1px; }
  .stop-wrap { background:none; border:0; }
  .stop-dot { width:20px; height:20px; border-radius:50%; background:#ffd23f; border:1.5px solid #222; color:#1d2329;
    font:700 12px/17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align:center; }
  #legend .it { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  #legend .sw { display:inline-block; width:18px; height:0; border-top:4px solid; border-radius:2px; }
  #legend .sw-done { border-top-color:#1e6fd9; }
  #legend .sw-ahead { border-top-color:#d9381e; }
  .stop-label { background:#fff; border:1px solid #888; border-radius:3px; padding:1px 4px; font-size:11px; white-space:nowrap; box-shadow:none; }
  .stop-label:before { display:none; }
  .cur-wrap { background:none; border:0; }
  #turn-banner { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:5; pointer-events:none;
    display:none; align-items:center; gap:12px; padding:8px 16px; border-radius:10px; max-width:calc(100% - 340px); min-width:200px;
    background:rgba(20,24,28,.78); color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.4); }
  #turn-banner[data-state="ahead"], #turn-banner[data-state="now"] { display:flex; }
  #turn-banner[data-state="now"] { background:#ffb300; color:#1d2329; }
  #turn-banner .tb-arrow { font-size:44px; line-height:1; min-width:44px; text-align:center; }
  #turn-banner .tb-main { font-size:20px; font-weight:700; line-height:1.2; }
  #turn-banner .tb-text { font-size:18px; line-height:1.25; }
  #turn-banner .tb-then { font-size:13px; opacity:.85; margin-top:3px; }
  /* Where am I: an icon button under the Leaflet zoom control (top-right); the info box is bottom-left, above the attribution. */
  #locate { position:absolute; right:10px; top:85px; z-index:1000; width:34px; height:34px; padding:0; margin:0; display:flex; align-items:center; justify-content:center;
    color:#1d2329; background:#fff; border:2px solid rgba(0,0,0,.2); border-radius:4px; background-clip:padding-box; cursor:pointer; }
  #locate svg { display:block; width:22px; height:22px; pointer-events:none; }
  #locate:hover { background:#f4f4f4; }
  #locate[aria-pressed="true"] { background:#1a8f3c; border-color:#1a8f3c; color:#fff; }
  #locate[aria-pressed="true"]:hover { background:#157a33; }
  #locate:focus-visible { outline:3px solid #1e6fd9; outline-offset:2px; }
  #locate.loc-wait { animation:locPulse 1.3s ease-in-out infinite; }
  @keyframes locPulse { 0% { box-shadow:0 0 0 0 rgba(26,143,60,.55); } 70% { box-shadow:0 0 0 10px rgba(26,143,60,0); } 100% { box-shadow:0 0 0 0 rgba(26,143,60,0); } }
  @media (prefers-reduced-motion: reduce) { #locate.loc-wait { animation:none; } }
  #locInfo { position:absolute; left:8px; bottom:28px; z-index:1001; width:max-content; max-width:min(360px, calc(100% - 16px));
    max-height:calc(100% - 100px); overflow-y:auto; padding:6px 10px; background:rgba(255,255,255,.97); border-radius:6px;
    font-size:13px; line-height:1.35; color:var(--fg); box-shadow:0 1px 4px rgba(0,0,0,.25); overflow-wrap:anywhere; }
  #locInfo[hidden], #locJump[hidden] { display:none; }
  #locActions { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-top:6px; }
  #locJump, #locClose { font:inherit; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; color:var(--fg); }
  #locJump { font-size:13px; padding:4px 10px; min-height:36px; }
  #locClose { width:36px; height:36px; padding:0; font-size:22px; line-height:1; }
  #locJump:hover, #locClose:hover { background:#eef0f2; }
  #locPrivacy { display:block; margin-top:2px; font-size:11.5px; color:#66707a; }
  .turn-wrap { background:none; border:0; }
  /* Zoomed out, turn markers would cover the route: show only the next turn until the map is zoomed in. */
  .turns-far .turn-dot:not(.next) { display:none; }
  .turns-far .turn-wrap { pointer-events:none; }
  .turn-dot { width:16px; height:16px; border-radius:50%; background:#fff; border:1.5px solid #444; color:#222;
    font-size:11px; line-height:13px; text-align:center; font-weight:700; }
  .turn-dot.next { background:#ffb300; border-color:#b36b00; box-shadow:0 0 0 3px rgba(255,179,0,.5); }

  /* Phone layout. Keep this query identical to PHONE_QUERY in the placement script below. */
  @media (max-width:800px), (max-height:480px) and (orientation:landscape) {
    body { overflow:hidden; }
    .lbl-long { display:none; }
    .lbl-short { display:inline; }
    #head { flex:none; flex-wrap:nowrap; align-items:center; gap:4px; min-height:52px; padding:4px 10px 4px 4px; }
    #back { flex:none; display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; font-size:26px; line-height:1; text-decoration:none; }
    #titleBlock { display:block; flex:1 1 auto; min-width:0; }
    #head h1 { font-size:16px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #status { display:block; padding:0; border:0; background:none; font-size:12.5px; line-height:1.3;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #status > * { margin-right:10px; }
    #sIdx { display:none; }
    #panes { flex:1 1 0; flex-direction:column; }
    #svPane { flex:4 1 0; }
    #mapPane { flex:5 1 0; border-left:0; border-top:1px solid var(--line); }
    /* Turn strip: a normal-flow band directly under the Street View, never over the image. */
    #turn-banner { position:static; top:auto; left:auto; transform:none; flex:none; width:100%; max-width:none; min-width:0;
      min-height:52px; padding:4px 12px; gap:10px; border-radius:0; box-shadow:none; background:#14181c; }
    #turn-banner[data-state="now"] { background:#ffb300; color:#1d2329; }
    #turn-banner .tb-arrow { font-size:30px; min-width:34px; }
    #turn-banner > div:last-child { flex:1 1 0; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 8px; }
    #turn-banner .tb-main { flex:none; font-size:17px; }
    #turn-banner .tb-text { flex:1 1 0; min-width:0; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #turn-banner .tb-then { flex:1 0 100%; min-width:0; font-size:12px; margin-top:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* Dock */
    #bar { flex:none; position:relative; z-index:10; flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:6px;
      padding:8px 12px calc(8px + env(safe-area-inset-bottom)); border-bottom:0; border-top:1px solid var(--line); }
    #slider { order:-1; flex:none; width:100%; min-width:0; height:32px; margin:0; accent-color:var(--accent); }
    #btnRow { display:flex; gap:6px; }
    #btnRow .group, #turnBtns { display:contents; }
    #btnRow button { flex:1 1 0; min-width:44px; min-height:48px; padding:0 2px; font-size:14px; line-height:1.1;
      display:flex; align-items:center; justify-content:center; white-space:nowrap; }
    #btnRow #play { flex:1.4 1 0; font-size:15px; }
    #bar #play { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    #bar #play:hover { background:#c0321a; }
    #prevTurn { order:1; } #prev { order:2; } #play { order:3; } #next { order:4; } #nextTurn { order:5; } #more { order:6; }
    #more { font-size:20px; }
    /* More sheet */
    #morePanel { display:none; position:absolute; left:0; right:0; bottom:100%; z-index:20; flex-direction:column; gap:8px;
      max-height:60vh; overflow:auto; padding:8px 12px; background:#fff; border-top:1px solid var(--line); box-shadow:0 -6px 16px rgba(0,0,0,.18); }
    #app.more-open #morePanel { display:flex; }
    #morePanel .group { flex-wrap:wrap; min-height:44px; }
    #morePanel select { min-height:44px; font-size:16px; }
    #morePanel #jumps button { min-height:44px; padding:0 14px; }
    #morePanel a { display:flex; align-items:center; min-height:44px; margin:0; color:var(--accent); }
    #morePanel #note { padding:4px 0; border:0; }
    #stopsToggle { min-height:28px; padding:4px 10px; }
    #stopsList li { padding:3px 0; }
    #locate { width:44px; height:44px; }
    #locInfo { left:8px; right:8px; bottom:26px; width:auto; max-width:none; max-height:96px; display:flex; align-items:center; gap:6px; padding:4px 4px 4px 10px; overflow:hidden; }
    #locInfo[hidden] { display:none; }
    #locText { flex:1 1 0; min-width:0; max-height:57px; overflow-y:auto; font-size:14px; line-height:1.3; }
    #locActions { flex:none; margin:0; gap:4px; }
    #locJump { width:84px; max-width:120px; min-height:44px; padding:2px 6px; font-size:13px; line-height:1.2; }
    #locClose { width:44px; height:44px; }
  }
  /* Landscape phone: panes side by side, dock in one compact row. */
  @media (max-height:480px) and (orientation:landscape) {
    #head { min-height:44px; padding:0 max(10px, env(safe-area-inset-right)) 0 max(4px, env(safe-area-inset-left)); }
    #panes { flex-direction:row; }
    #svPane { flex:1 1 0; }
    #mapPane { flex:1 1 0; border-top:0; border-left:1px solid var(--line); }
    #turn-banner { min-height:40px; padding:2px 10px; }
    #turn-banner .tb-arrow { font-size:24px; min-width:28px; }
    #bar { flex-direction:row; align-items:center; gap:10px;
      padding:4px max(12px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
    #slider { order:0; flex:1 1 0; width:auto; min-width:120px; }
    #btnRow { flex:none; }
    #btnRow button { flex:none; width:52px; min-height:44px; }
    #btnRow #play { width:64px; }
  }
</style>
</head>
<body>
<div id="error"></div>
<div id="app">
  <div id="head">
    <a id="back" href="index.html" aria-label="All courses" title="All courses"><span class="lbl-long">&larr; All courses</span><span class="lbl-short">&larr;</span></a>
    <div id="titleBlock">
      <h1 id="courseName"></h1>
      <div id="status">
        <strong id="sSection"></strong>
        <span id="sKm"></span>
        <span id="sIdx"></span>
        <span id="sTurn"></span>
      </div>
    </div>
  </div>
  <div id="panes">
    <div id="svPane">
      <div id="svWrap">
        <iframe id="sv" title="Google Street View" allow="accelerometer; gyroscope" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div id="turn-banner" data-state="none" aria-live="polite"></div>
    </div>
    <div id="mapPane">
      <div id="map"></div>
      <div id="legend">
        <div id="legendRow">
          <span class="it"><span class="sw sw-done"></span>Ridden</span>
          <span class="it"><span class="sw sw-ahead"></span>Ahead</span>
          <button id="stopsToggle" type="button" aria-expanded="false" aria-controls="stopsList">Stops <span class="caret" aria-hidden="true">&#9662;</span></button>
        </div>
        <ol id="stopsList" hidden></ol>
      </div>
      <button id="locate" type="button" aria-pressed="false" aria-label="Where am I" title="Where am I"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button>
      <div id="locInfo" role="status" aria-live="polite" hidden>
        <span id="locText"></span>
        <div id="locActions">
          <button id="locJump" type="button" hidden>Next turn from here</button>
          <button id="locClose" type="button" aria-label="Turn off location" title="Turn off location">&times;</button>
        </div>
      </div>
    </div>
  </div>
  <div id="bar">
    <div id="btnRow">
      <div class="group">
        <button id="prev" title="Previous (Left arrow)" aria-label="Previous"><span class="lbl-long">&#9664; Previous</span><span class="lbl-short">&#9664;</span></button>
        <button id="play" title="Play/Pause (Space)">Play</button>
        <button id="next" title="Next (Right arrow)" aria-label="Next"><span class="lbl-long">Next &#9654;</span><span class="lbl-short">&#9654;</span></button>
      </div>
      <div class="group" id="turnBtns" style="display:none">
        <button id="prevTurn" title="Previous turn (Down arrow)" aria-label="Previous turn"><span class="lbl-long">&#9664; Prev turn</span><span class="lbl-short">&#9198; turn</span></button>
        <button id="nextTurn" title="Next turn (Up arrow)" aria-label="Next turn"><span class="lbl-long">Next turn &#9654;</span><span class="lbl-short">turn &#9197;</span></button>
      </div>
      <button id="more" type="button" aria-expanded="false" aria-controls="morePanel" aria-label="More controls" title="More: speed, sections, links">&#8943;</button>
    </div>
    <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Position along course">
    <div id="morePanel">
      <div class="group">
        <label for="speed">Speed</label>
        <select id="speed">
          <option value="1500">1.5 s / step</option>
          <option value="2500" selected>2.5 s / step</option>
          <option value="4000">4 s / step</option>
        </select>
      </div>
      <div class="group" id="jumps"></div>
      <a id="gmaps" target="_blank" rel="noopener" href="#">Open this spot in Google Maps</a>
      <a id="dlGpx" download href="#">Download GPX</a>
      <p id="note">A blank or black view means Google has no Street View imagery at this spot. Press Next to move on.<span id="locPrivacy">Where am I sends your position to brouter.de to find the road back.</span></p>
    </div>
  </div>
</div>
<script>
/* Place the nodes that live in different spots on phone and desktop. Runs before first paint and on every breakpoint change. */
(function () {
  var PHONE_QUERY = '(max-width:800px), (max-height:480px) and (orientation:landscape)';
  var mq = window.matchMedia ? window.matchMedia(PHONE_QUERY) : null;
  function $(id) { return document.getElementById(id); }
  function place() {
    var phone = !!(mq && mq.matches);
    var app = $('app'), panes = $('panes'), bar = $('bar'), status = $('status');
    if (phone) {
      app.appendChild(bar);
      $('titleBlock').appendChild(status);
      var panel = $('morePanel');
      panel.appendChild($('gmaps')); panel.appendChild($('dlGpx')); panel.appendChild($('note'));
    } else {
      app.insertBefore(bar, panes);
      app.insertBefore(status, panes);
      status.appendChild($('gmaps'));
      $('head').appendChild($('dlGpx'));
      $('svPane').appendChild($('note'));
      app.classList.remove('more-open');
      $('more').setAttribute('aria-expanded', 'false');
    }
  }
  place();
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', place); else if (mq.addListener) mq.addListener(place); }
})();
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';
  var STEP_M = 40, AHEAD_M = 8;

  function showError(msg) {
    var e = document.getElementById('error');
    e.textContent = msg + ' ';
    var a = document.createElement('a');
    a.href = 'index.html';
    a.textContent = 'Back to all courses';
    e.appendChild(a);
    e.style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
  function loadScript(src, ok, bad) {
    var s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = bad;
    document.head.appendChild(s);
  }
  function loadCourse(slug) {
    if (!/^[a-z0-9-]+$/.test(slug)) { showError('Invalid course name.'); return; }
    loadScript('courses/' + slug + '/course-data.js', function () {
      var C = window.COURSE;
      if (!C || !C.segments || !C.segments.length) { showError('The data for course "' + slug + '" is not valid.'); return; }
      boot(C, slug);
    }, function () { showError('Could not load course "' + slug + '".'); });
  }
  var param = new URLSearchParams(location.search).get('course');
  if (param !== null) loadCourse(param);
  else loadScript('courses/index.js', function () {
    var list = window.COURSES;
    if (!list || !list.length) { showError('There are no courses yet.'); return; }
    loadCourse(list[0].slug);
  }, function () { showError('Could not load the course list.'); });

function boot(C, slug) {
  var STORE_KEY = 'streetview.index.' + slug;
  document.title = C.name + ' \u2013 Street View';
  document.getElementById('courseName').textContent = C.name;
  var dl = document.getElementById('dlGpx'); dl.href = 'courses/' + slug + '/' + C.gpx;

  // ---- geometry ----
  var R = 6371000, rad = Math.PI / 180;
  function hav(a, b) {

    if (!z) return;
    var zr = z.getBoundingClientRect(), pr = $('mapPane').getBoundingClientRect();
    if (zr.height > 0 && pr.height > 0) locBtn.style.top = Math.round(zr.bottom - pr.top + 9) + 'px';
  }
  locPlaceBtn();
  window.addEventListener('resize', locPlaceBtn);
  window.addEventListener('orientationchange', function () { setTimeout(locPlaceBtn, 100); });

  function compassName(b) { return COMPASS[Math.round((((b % 360) + 360) % 360) / 45) % 8]; }
  function fmtDistance(m) { var r = Math.round(m / 10) * 10; return r >= 1000 ? (m / 1000).toFixed(1) + ' km' : r + ' m'; }
  function locSay(msg, withJump) {
    if (msg !== locShown) { locText.textContent = msg; locShown = msg; } // same text again: do not re-announce
    locJump.hidden = !withJump;
    locInfo.hidden = false;
  }
  // Pulse the button while we wait for the first fix or for the first road route.
  function locSyncBtn() {
    var waiting = locOn && (locLast === null || (locInFlight && !locRoute));
    if (waiting) locBtn.classList.add('loc-wait'); else locBtn.classList.remove('loc-wait');
  }
  function locClearRoute() {
    if (locRoute) locRoute.layers.forEach(function (l) { map.removeLayer(l); });
    locRoute = null;
  }
  function locClearLine() { if (locLine) { map.removeLayer(locLine); locLine = null; } }
  // Forget any batch in flight: its answer is ignored (the id no longer matches) and its fetches are aborted.
  function locCancelBatch() {
    locReqId++;
    locInFlight = false;
    clearTimeout(locReqTimer); locReqTimer = null;
    if (locCtl) { try { locCtl.abort(); } catch (e) {} locCtl = null; }
  }
  function locClearLayers() {
    [locDot, locCircle].forEach(function (l) { if (l) map.removeLayer(l); });
    locDot = locCircle = null;
    locClearLine(); locClearRoute();
  }
  function locStop() {
    if (locWatch !== null && navigator.geolocation) navigator.geolocation.clearWatch(locWatch);
    locWatch = null; locOn = false; locLast = null; locShown = null; locFix = null;
    locCancelBatch();
    locReqFix = null; locReqAt = 0; locFreshEpisode = true; locRoadFailed = false; locRouteFitted = false;
    locClearLayers();
    locBtn.setAttribute('aria-pressed', 'false');
    locInfo.hidden = true; locJump.hidden = true; locText.textContent = '';
    locSyncBtn();
  }
  function locFail(msg) { locStop(); locSay(msg, false); }
  function locBegin() {
    locOn = true; locFirst = true; locLast = null; locRouteFitted = false;
    locBtn.setAttribute('aria-pressed', 'true');
    locSay('Finding your location…', false);
    locSyncBtn();
  }

  // ---- road route back to the course (BRouter) ----
  function alongPoint(d) { d = Math.max(0, Math.min(total, d)); var p = posAt(d); return { lat: p[0], lon: p[1], alongM: d }; }
  function fetchRoute(fix, t, signal) {
    var url = BROUTER_URL + fix[1].toFixed(6) + ',' + fix[0].toFixed(6) + '%7C' + t.lon.toFixed(6) + ',' + t.lat.toFixed(6) +
      '&profile=trekking&alternativeidx=0&format=geojson';
    return fetch(url, signal ? { signal: signal } : {}).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (gj) {
      var f = gj && gj.features && gj.features[0], c = f && f.geometry && f.geometry.coordinates;
      if (!c || c.length < 2) throw new Error('no route');
      var ll = [], len = 0, i;
      for (i = 0; i < c.length; i++) {
        if (!isFinite(c[i][0]) || !isFinite(c[i][1])) throw new Error('bad coordinates');
        ll.push([c[i][1], c[i][0]]);
        if (i) len += hav(ll[i - 1], ll[i]);
      }
      var m = parseFloat(f.properties && f.properties['track-length']);
      return { roadM: isFinite(m) && m > 0 ? m : len, latlngs: ll, target: t };
    });
  }
  // One batch: the nearest course point (a) and the point 400 m further along (b), fetched in parallel.
  // The shorter road route wins; on a tie (b), which is further along. One failing is fine; both failing keeps the straight line.
  function locRequestRoute(fix, r) {
    var id = ++locReqId;
    locReqFix = fix; locReqAt = Date.now(); locFreshEpisode = false;
    if (typeof fetch !== 'function') { locRoadFailed = true; return; } // no fetch: keep the straight line
    var cands = [{ lat: r.lat, lon: r.lon, alongM: r.alongM }], ahead = alongPoint(r.alongM + AHEAD_CANDIDATE_M);
    if (ahead.alongM - r.alongM > 1) cands.push(ahead); // at the very end of the course (b) is the same point as (a)
    locInFlight = true; locRoadFailed = false;
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    locCtl = ctl;
    var timeout = new Promise(function (resolve, reject) {
      locReqTimer = setTimeout(function () { if (ctl) { try { ctl.abort(); } catch (e) {} } reject(new Error('timeout')); }, ROUTE_TIMEOUT_MS);
    });
    var jobs = cands.map(function (t) {
      locReqCount++;
      var p;
      try { p = fetchRoute(fix, t, ctl ? ctl.signal : null); } catch (e) { p = Promise.reject(e); }
      return Promise.race([p, timeout]).then(function (x) { return x; }, function () { return null; });
    });
    Promise.all(jobs).then(function (results) {
      if (id !== locReqId || !locOn) return; // stale: a newer batch started, or Where am I was turned off
      clearTimeout(locReqTimer); locReqTimer = null; locCtl = null; locInFlight = false;
      var best = null;
      results.forEach(function (x) { if (x && (!best || x.roadM <= best.roadM)) best = x; });
      if (!best) { locRoadFailed = true; locRender(); return; }
      locRoadFailed = false;
      locClearRoute();
      locRoute = locDrawRoute(best, fix);
      if (!locRouteFitted) { // fit to the route on the first success only
        locRouteFitted = true;
        var phone = !!(window.matchMedia && window.matchMedia(PHONE_MQ).matches);
        map.fitBounds(L.latLngBounds(locRoute.points), { paddingTopLeft: [40, 56], paddingBottomRight: [64, phone ? 136 : 110], maxZoom: 17 });
      }
      locRender();
    });
  }
  function locDrawRoute(best, fix) {
    var pts = best.latlngs.slice(), tg = [best.target.lat, best.target.lon];
    if (hav(fix, pts[0]) > 2) pts.unshift(fix);
    if (hav(pts[pts.length - 1], tg) > 2) pts.push(tg);
    var casing = L.polyline(pts, { color: '#fff', weight: 8, opacity: 0.95, lineJoin: 'round', lineCap: 'round', interactive: false }).addTo(map);
    var line = L.polyline(pts, { color: LOC_GREEN, weight: 5, opacity: 1, lineJoin: 'round', lineCap: 'round', interactive: false }).addTo(map);
    var ring = L.circleMarker(tg, { radius: 7, color: LOC_GREEN, weight: 3, opacity: 1, fillColor: '#fff', fillOpacity: 0.5, interactive: false }).addTo(map);
    return { roadM: best.roadM, targetAlongM: best.target.alongM, layers: [casing, line, ring], points: pts };
  }

  // Draw everything that depends on the latest fix and the route state, and write the message.
  function locRender() {
    if (!locOn || !locLast || !locFix) { locSyncBtn(); return; }
    var r = locLast, fix = locFix, np = [r.lat, r.lon], off = r.distM > ON_ROUTE_M, far = r.distM > FAR_M;
    var km = 'km ' + (r.alongM / 1000).toFixed(2), msg, jump = true;
    if (!off || far) { locClearRoute(); locClearLine(); }
    else if (locRoute) locClearLine();
    else if (!locLine) locLine = L.polyline([fix, np], { color: LOC_GREEN, weight: 3, opacity: 0.9, dashArray: '6 8', interactive: false }).addTo(map);
    else locLine.setLatLngs([fix, np]);
    if (locDot) locDot.bringToFront();
    if (!off) msg = 'You are on the route, at ' + km + ' of ' + (total / 1000).toFixed(2) + '.';
    else if (far) { msg = 'You are ' + (r.distM / 1000).toFixed(1) + ' km from this course.'; jump = false; }
    else if (locRoute) msg = 'You are off the route. Follow the green line for ' + fmtDistance(locRoute.roadM) + ' to rejoin it at km ' + (locRoute.targetAlongM / 1000).toFixed(2) + '.';
    else {
      msg = 'You are ' + fmtDistance(r.distM) + ' from the route. Head ' + compassName(r.bearing) + ' to rejoin it at ' + km + '.';
      if (locRoadFailed) msg += ' (road route unavailable)';
    }
    if (locAcc > LOW_ACC_M) msg += ' GPS ±' + Math.round(locAcc) + ' m.';
    locSay(msg, jump);
    locSyncBtn();
  }
  // Throttle: never two batches at once; a new one only after the fix moved more than 40 m AND 15 s have passed.
  // (The very first request of a session goes out at once. After a failure the same rule applies: no instant retry.)
  function locWantRoute(fix) {
    if (locInFlight) return false;
    if (locReqFix === null) return true;
    var waited = Date.now() - locReqAt >= ROUTE_GAP_MS;
    if (locFreshEpisode) return waited; // was on the course (or too far) and is off again: ask again once the gap has passed
    return hav(fix, locReqFix) > ROUTE_MOVE_M && waited;
  }
  function locOnFix(lat, lon, acc) {
    if (!isFinite(lat) || !isFinite(lon)) return;
    acc = isFinite(acc) && acc > 0 ? acc : 0;
    var r = nearestOnCourse(lat, lon, points[index]._d), fix = [lat, lon], np = [r.lat, r.lon];
    locLast = r; locFix = fix; locAcc = acc;
    if (!locCircle) locCircle = L.circle(fix, { radius: acc, color: LOC_GREEN, weight: 1, opacity: 0.6, fillColor: LOC_GREEN, fillOpacity: 0.12, interactive: false }).addTo(map);
    else { locCircle.setLatLng(fix); locCircle.setRadius(acc); }
    if (!locDot) locDot = L.circleMarker(fix, { radius: 8, color: '#fff', weight: 3, opacity: 1, fillColor: LOC_GREEN, fillOpacity: 1, interactive: false }).addTo(map);
    else locDot.setLatLng(fix);
    if (r.distM <= ON_ROUTE_M || r.distM > FAR_M) { // on the course, or too far to route: drop any route and ignore a batch still in flight
      locCancelBatch(); locRoadFailed = false; locFreshEpisode = true;
    } else if (locWantRoute(fix)) locRequestRoute(fix, r);
    locRender();
    if (locFirst) { // fit once; later fixes never move the map
      locFirst = false;
      map.fitBounds(L.latLngBounds([fix, np]), { padding: [50, 50], maxZoom: 17 });
    }
  }
  function locStart() {
    if (!navigator.geolocation || window.isSecureContext === false) { locFail(MSG_NOGEO); return; }
    locBegin();
    try {
      locWatch = navigator.geolocation.watchPosition(function (pos) {
        if (locOn) locOnFix(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
      }, function (err) {
        if (locOn) locFail(err && err.code === 1 ? MSG_BLOCKED : MSG_FAILED);
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
    } catch (e) { locFail(MSG_NOGEO); }
  }
  function nearestViewIdx(d) {
    var best = 0, bd = Infinity;
    for (var i = 0; i < points.length; i++) { var dd = Math.abs(points[i]._d - d); if (dd < bd) { bd = dd; best = i; } }
    return best;
  }
  locBtn.addEventListener('click', function () { if (locOn) locStop(); else locStart(); });
  locClose.addEventListener('click', function () { locStop(); });
  locJump.addEventListener('click', function () {
    if (!locLast) return;
    var i = nearestViewIdx(locRoute ? locRoute.targetAlongM : locLast.alongM);
    setIndex(i);
    map.panTo([points[i].lat, points[i].lon]);
  });
  var locate = {
    nearest: function (lat, lon) { return nearestOnCourse(lat, lon, points[index]._d); },
    setFix: function (lat, lon, accuracyM) { if (!locOn) locBegin(); locOnFix(Number(lat), Number(lon), Number(accuracyM)); },
    stop: locStop,
    isOn: function () { return locOn; },
    getState: function () {
      var far = !!locLast && locLast.distM > FAR_M;
      return { on: locOn, distM: locLast ? locLast.distM : null, alongM: locLast ? locLast.alongM : null,
        roadM: locRoute ? locRoute.roadM : null,
        targetAlongM: locRoute ? locRoute.targetAlongM : (locLast && !far ? locLast.alongM : null),
        routePoints: locRoute ? locRoute.points.length : 0, message: locText.textContent, requests: locReqCount };
    }
  };

  window.__viewer = { course: slug, points: points, getIndex: function () { return index; }, setIndex: setIndex, lineCheck: lineCheck, turns: turns, nextTurn: nextTurn, stopMarkers: stopMarkers, locate: locate };

  render();
  clearTimeout(svTimer);
  loadSV(); // first load without the debounce delay
}
})();
</script>
</body>
</html>
